[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "randomized-optimal-stopping-rl"
version = "1.0.0"
description = "Finite differences, Longstaff-Schwartz and neural policy iteration for exploratory optimal stopping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
rl = ["torch>=2.0"]
dev = ["pytest>=7.0", "jupyter>=1.0", "matplotlib>=3.7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
